name: Deploy Firestore Rules

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules' # Only run when the rules file changes

jobs:
  deploy_rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      
      # We create a temporary key file safely without corrupting JSON escape characters
      - name: Create SA Key file
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: printf "%s" "$SA_KEY" > /tmp/firebase-key.json

      - name: Deploy Firestore Rules
        run: firebase deploy --only firestore:rules --project markdown-notes-app-36e97
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
